name: CI

on: [pull_request, workflow_dispatch]

permissions: {}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Lint code
        run: |
          pipx run nox -s check_code

      - name: Check format
        run: |
          pipx run nox -s check_format

      - name: Type check
        run: |
          pipx run nox -s check_types

      - name: Build docs
        run: |
          pipx run nox -s docs

      - name: Build wheel
        run: |
          pipx run nox -s build

  tests:
    name: Test Python ${{ matrix.python_version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python_version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python_version }}
          allow-prereleases: true
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Test
        run: |
          pipx run nox -s coverage --python ${{ matrix.python_version }}
